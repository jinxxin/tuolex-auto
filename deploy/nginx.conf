server {
    listen 80;
    # 内网编排/外部接口不对公网暴露（qa D4）
    location ~ ^/api/(?:[a-zA-Z0-9_-]+/)?internal/ { return 404; }

    resolver 127.0.0.11 valid=10s ipv6=off;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 大文件上传（EBOM/STEP 等）：覆盖 nginx 默认 1m 限制，与后端 express.json 50mb 对齐
    client_max_body_size 60m;

    # 统一入口路径前缀（方案A）：/auto/ → 剥前缀映射到根（云端由 easyx-tls 剥，本地直接访问时这里处理）
    location /auto/ {
        rewrite ^/auto/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # /auto/ 前缀下的 API 转发（剥前缀后走 /api/ 代理）
    location /auto/api/ {
        rewrite ^/auto/(.*)$ /$1 break;
        proxy_pass http://easyauto-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    # 前端静态资源（SPA 路由回退）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理（同域，避免 CORS；容器内后端服务名为 easyauto-api）
    location /api/stats/ {
        proxy_pass http://stats-api:3000;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/ {
        set $api_upstream easyauto-api;
        proxy_pass http://$api_upstream:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    # EasyX 统一用户管理（代理到门户，供「前往 EasyX 用户管理」跳转）
    location = /user-admin.html {
        proxy_pass http://easyx-web:80/user-admin.html;
        proxy_set_header Host $host;
    }
    location /api/easyx/ {
        rewrite ^/api/easyx/(.*)$ /api/$1 break;
        proxy_pass http://easyx-api:3000;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # index.html 不缓存（保证升级后立即拿到新版本，避免旧 bundle 缓存）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 静态资源长缓存（文件名带 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
