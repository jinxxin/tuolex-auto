name: Bug report
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提 issue 前请先搜索是否已有同类问题。安全漏洞请**不要**公开提 issue，见 SECURITY.md。
  - type: input
    id: version
    attributes:
      label: 版本 / 镜像
      description: Release tag 或 commit sha
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 发生了什么？期望是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. docker compose up -d
        2. 新建项目 ...
        3. 打开 ...
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境
      placeholder: |
        OS: Ubuntu 24.04 / macOS 15
        Docker: 27.x
        浏览器: Chrome 130
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志（docker compose logs api 末尾）
      render: shell
