name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Install server deps
        run: npm ci --no-audit --no-fund
        working-directory: server

      - name: Lint
        run: npm run lint

      - name: i18n key check
        run: npm run i18n:check

      - name: Unit tests
        run: npm run test:fs

      - name: Build
        run: npm run build

      - name: Server type-check
        run: npm run typecheck
        working-directory: server

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8087/api/health | grep -q '"ok":true'; then
              echo "API healthy after $((i * 3))s"
              exit 0
            fi
            sleep 3
          done
          echo "::error::API did not become healthy in 180s"
          docker compose logs --no-color | tail -n 120
          exit 1

      - name: Smoke checks
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8087/api/health
          curl -fsS -o /dev/null -w "index %{http_code}\n" http://localhost:8087/
          curl -fsS -o /dev/null -w "favicon %{http_code}\n" http://localhost:8087/favicon.svg

      - name: Tear down
        if: always()
        run: docker compose down -v
