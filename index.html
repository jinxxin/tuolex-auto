<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b6ca8'/%3E%3Ctext x='16' y='22' font-size='15' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3E✓%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tuoleauto — 汽车软件过程改进（A-SPICE）合规管理平台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
      <script>
  // 访问统计：整页加载 + SPA 路由切换（hashchange）均记录，page=平台+路由路径
  (function () {
    var PLATFORM = 'easyauto';
    var lastSent = { r: '', t: 0 };
    function hit() {
      var route = (location.hash || '#/').replace(/^#/, '').slice(0, 60) || '/';
      var now = Date.now();
      // 1 秒内同路由不重复发送（去重 hashchange/popstate 双触发）
      if (route === lastSent.r && now - lastSent.t < 1000) return;
      lastSent = { r: route, t: now };
      fetch('/api/stats/hit', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ page: PLATFORM + route, ref: document.referrer.slice(0, 200) }) }).catch(function () {});
    }
    hit();
    window.addEventListener('hashchange', function () { setTimeout(hit, 300); });
    window.addEventListener('popstate', function () { setTimeout(hit, 300); });
  })();
</script>  <script>
  </script>
</body>
</html>
